# Pulls your publications from Google Scholar every Monday and saves them
# to data/publications.json. You can also run it any time:
# GitHub > Actions > "Update publications" > Run workflow.
name: Update publications

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 09:00 Bangladesh time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install helpers
        run: pip install requests beautifulsoup4 pyyaml

      - name: Fetch publications from Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_publications.py

      - name: Save changes
        run: |
          git config user.name "publications-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update publications from Google Scholar"
            git push
          fi
