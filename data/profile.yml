intro:
  - I am a Postdoctoral Research Fellow at the Interdisciplinary Research Center for Sustainable Energy Systems (IRC-SES), KFUPM, Saudi Arabia, and an Associate Professor of Electrical and Electronic Engineering at Jashore University of Science and Technology (JUST), Bangladesh, where I lead the Energy Grid (EG) Research Group.
  - My research focuses on data-driven decision-making for low-carbon energy systems and grid resilience, including distribution grid flexibility, DER integration and agri-energy systems.

