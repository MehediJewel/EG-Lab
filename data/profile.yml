# Introduction paragraphs. Each paragraph starts with "- ".
intro:
  - I am a Postdoctoral Research Fellow at the Interdisciplinary Research Center for Sustainable Energy Systems (IRC-SES), King Fahd University of Petroleum & Minerals (KFUPM), Saudi Arabia, and an Associate Professor in the Department of Electrical and Electronic Engineering at Jashore University of Science and Technology (JUST), Bangladesh.
  - My research focuses on data-driven decision-making for optimizing low-carbon energy systems and enhancing grid resilience, from distribution grid flexibility and DER integration to energy systems for agriculture. I received my Ph.D. in Engineering from Macquarie University, Sydney, in 2022, working on HVDC grid dynamics and DC fault identification, and my B.Sc. and M.Sc. in EEE from KUET, Bangladesh.
  - At JUST I lead the Energy Grid (EG) Research Group, where I supervise Master's and undergraduate thesis students.

