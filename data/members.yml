lead:
  name: Dr. Mehedi Hassan (Jewel)
  title: Associate Professor · EEE, JUST
  badge: Lead · EG Research Group
  photo: dr-mehedi-hassan.jpg
  bio:
    - Dr. M. Hassan received his Ph.D. in Engineering from Macquarie University, Sydney, Australia, in 2022. He earned his B.Sc. and M.Sc. degrees in Electrical and Electronic Engineering from Khulna University of Engineering and Technology (KUET), Bangladesh, in 2010 and 2016, respectively.
    - He joined the Department of Electrical and Electronic Engineering at Jashore University of Science & Technology (JUST) in 2015, where he is now an Associate Professor. His current research focuses on data-driven decision-making for optimizing low-carbon energy systems and enhancing grid resilience.
  education:
    - degree: Ph.D. in Engineering
      institution: Macquarie University
      where: Sydney, Australia · 2022
      note: Dissertation research on HVDC grid dynamics, DC fault identification, and control of AC/DC power systems.
