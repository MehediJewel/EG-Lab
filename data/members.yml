lead:
  name: Dr. Mehedi Hassan (Jewel)
  title: Associate Professor, Department of EEE, JUST
  role: Principal Investigator, EG Lab
  photo: dr-mehedi-hassan.jpg
  bio: |
    Dr. Hassan received his Ph.D. in Engineering from Macquarie University, Sydney, in 2022, with
    research on HVDC grid dynamics, DC fault identification and control of AC/DC power systems.
    He joined the Department of EEE at JUST in 2015, where he is now an Associate Professor. His
    research focuses on data-driven decision-making for optimising low-carbon energy systems and
    enhancing grid resilience.
  education:
    - Ph.D. in Engineering, Macquarie University, Sydney, Australia (2022)
    - M.Sc. in EEE, Khulna University of Engineering & Technology (2016)
    - B.Sc. in EEE, Khulna University of Engineering & Technology (2010)
  email: m.hassan@just.edu.bd

