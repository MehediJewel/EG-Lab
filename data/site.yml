about: |
  The Energy Grid (EG) Research Group is an active research initiative in the
  Department of Electrical and Electronic Engineering at Jashore University of
  Science and Technology (JUST). We work on sustainable energy systems, grid
  modernisation and the move toward high shares of renewable energy, and we train
  the next generation of power engineers and scientists.

