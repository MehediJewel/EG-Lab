about:
  - The Energy Grid (EG) Research Group is an active research initiative within the Department of Electrical and Electronic Engineering (EEE) at Jashore University of Science and Technology (JUST). Our focus is on sustainable energy systems, supporting the modernization of the electricity grid and the transition toward high penetrations of renewable energy technologies.
  - Our team, comprising motivated undergraduate and Master's students under Dr. Mehedi's supervision, works with institutional and external resources to bridge theory and real-world impact.

