intro: Our research aims to accelerate the transition to sustainable energy — modernizing grid infrastructure, optimizing low-carbon systems through data-driven approaches, and enhancing resilience in evolving power networks.

# Three short goals shown with a tick
mission:
  - Modernizing grid infrastructure for high renewable energy integration.
  - Optimizing low-carbon systems through data-driven approaches.
  - Enhancing resilience in evolving power networks.

interests:
  - title: Data-Driven Decision-Making
    text: Optimizing low-carbon energy systems through data-driven approaches, from forecasting to real-time operation.
  - title: Grid Resilience & Modernization
    text: Modernizing grid infrastructure for high renewable energy integration and enhancing resilience in evolving power networks.
  - title: Microgrids & Hybrid Energy Systems
    text: Mission-aware robust control, defense-centric design, and techno-economic optimization of islanded and grid-connected microgrids.
  - title: AI for Power Systems
    text: Machine-learning-based fault classification, localization, and diagnostics in renewable-integrated power systems.
  - title: EV & Battery Systems
    text: EV impact analysis, battery health monitoring under uncertainty, and degradation-aware intelligent BESS management.
  - title: HVDC & AC/DC System Dynamics
    text: DC fault identification in multiterminal HVDC systems, adaptive droop control, and impact of HVDC control on power system dynamics.

current:
  - title: Mission-Aware Robust MPC for Tactical Microgrids under Monsoon Uncertainty
    text: Intelligent operation of hybrid microgrids in remote and mission-critical environments. A mission-aware Model Predictive Control (MPC) framework is developed for a hybrid PV–battery–diesel system, where mission priorities are directly incorporated into the control strategy, improving resilience and operational efficiency without requiring additional capacity.
  - title: Consumer-Driven Grid Variability with Electric Vehicle and Renewable Integration
    text: Integration of EVs and photovoltaic (PV) systems within a small-scale distribution network at JUST, using DIgSILENT PowerFactory quasi-dynamic simulation for 2024. The study evaluates system performance under varying EV penetration levels, highlighting transformer overloading and increased system losses, and investigates solutions for a stable, resilient grid.
  - title: Machine Learning-based Fault Classification and Localization in Renewable Integrated Power Systems
    text: A simplified machine learning-based approach for fault classification and localization in power systems with integrated EV and PV, using only three-phase voltage and current data from DIgSILENT PowerFactory simulations, avoiding intricate feature engineering while aiming for accurate, real-time-ready fault diagnostics.
  - title: Optimizing Grid Resilience with Cost-Effective Integration of EV, PV, and Electrolyzer Systems
    text: Economically viable pathways to enhance grid resilience at high renewable penetration. Through high-level modeling and optimization, the study explores combinations of solar PV, energy storage, demand response, and grid interconnections, offering strategic insights for policymakers, utilities, and energy planners.

